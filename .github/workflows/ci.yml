name: ci

on:
  push:
    branches: [main]
  pull_request:

# The runner image is **pinned**, not `ubuntu-latest`.
#
# `ubuntu-latest` moves from Ubuntu 24.04 to 26.04 between 19 October
# and 19 November 2026, so an unpinned job lands on either image for a
# month. The `native` job's result depends on the GTK version (see
# below), so it must not be a lottery: Ubuntu 26.04 ships GTK 4.22 —
# the same series as the maintainer's machine, where the native suites
# pass.
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v2
        with:
          sdk: ^3.13.4

      # libgirepository1.0-dev ships the upstream `.gir` files under
      # `/usr/share/gir-1.0/` — only needed by the `GirLoader` test
      # in `generator/test/loader_test.dart`. That test now skips
      # cleanly when the directory has no `.gir` files, so the
      # workflow stays green even if a future Ubuntu point release
      # drops the package. Other `-dev` packages create the directory
      # for their own `.typelib` files but leave it empty of `.gir`,
      # which is why the loader test's skip condition has to look at
      # the actual files.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev

      - name: dart pub get
        run: dart pub get

      - name: dart analyze
        run: dart analyze

      # The site's sources live in `site_src/`; the rendered output in
      # `site/` is committed so the site stays browsable without a
      # build. The two steps below prove the committed copy is what the
      # generator produces — first the derived facts, then the pages.
      #
      # `site/docs/` is gitignored, so the diff below never sees the
      # dartdoc output the API build produces later in this job.
      - name: Collect site facts
        run: |
          dart run tool/collect_facts.dart
          git diff --exit-code site_src/data/facts.json

      - name: Build site
        run: |
          dart run tool/build_site.dart
          git diff --exit-code site/

      # The generated-code-compiles gate, end to end. The example is
      # a real consumer: it declares `@GtkTemplate`, pulls the
      # generated part file in with a `part` directive, and the
      # builder writes the mixin next to its source (`build_to:
      # source` in the provider package's `build.yaml`).
      #
      # This catches the whole class of "the codegen emitted
      # something that does not compile" regressions — including the
      # ones that only the analyzer can see, like a missing import
      # in the user's library.
      #
      # `example/todo` is a workspace member, so the root `dart pub
      # get` above already resolved it; there is no second resolution
      # step here.
      #
      # This runs *before* the test step: `example/todo`'s own test
      # asserts the part-file contract, and it needs the generated
      # file to be there.
      - name: build + analyze example/todo
        working-directory: example/todo
        run: |
          dart run build_runner build
          dart analyze

      # The test suites CI runs.
      #
      # `dart test` with no argument runs only the *root* package's own
      # `test/` directory. The suites live in their own packages, so
      # they have to be named. These are the ones that do
      # not need a native GTK stack:
      #   - `generator`                    — the generator's own unit tests
      #   - `packages/gir_ffi`             — the runtime helpers (pure Dart)
      #   - `packages/dart_gobject`        — the Dart-type registry (GLib
      #                                     only — no GTK, no display)
      #   - `packages/gtk_templates`       — the template runtime
      #   - `packages/gtk_templates_builder` — the scanner, the codegen
      #   - `example/todo`                 — the part-file contract, plus
      #                                     the native widget test (which
      #                                     skips itself without a
      #                                     display)
      #   - `test`                         — the site generator's tests,
      #                                     including the drift check
      #                                     that the committed `site/`
      #                                     matches `site_src/`
      #
      # `packages/gtk_templates_builder/test/generated_code_test.dart`
      # and `test/builder_output_test.dart` are the gate that was
      # missing when four codegen bugs shipped: they resolve the
      # generated part file with the real analyzer and assert zero
      # diagnostics, and they re-introduce each historical bug to
      # prove the check has teeth.
      #
      # `test/site/site_output_test.dart` is the site equivalent: it
      # renders every page from `site_src/` and compares the result
      # with the committed `site/`, and it walks the generated HTML
      # checking that every internal link resolves. It replaces the
      # ad-hoc Python link check this workflow used to carry.
      - name: dart test
        run: dart test generator example/todo packages/dart_gobject packages/gir_ffi packages/gtk_templates packages/gtk_templates_builder test

      # NB: we deliberately do NOT re-run the generator against the
      # system's `/usr/share/gir-1.0/` here. The GIR files shipped
      # with Ubuntu 26.04 (libgirepository1.0-dev) differ from those
      # shipped with Fedora 44 (glib2-devel) — different GLib / GTK
      # versions mean different `<method>` `<constructor>` `<function>`
      # content, different nullability flags, and different
      # `transfer-ownership` defaults. Regenerating from the system
      # GIR on Ubuntu produces Dart that doesn't match the committed
      # source (e.g. `GAsyncQueue.new_` becomes a `factory GAsyncQueue`
      # in older GIRs, and `saveFinish` flips between throwing and
      # nullable). The committed `packages/<lib>/lib/src/*.dart` is
      # the source of truth; the generator unit tests above use
      # bundled GIR fixtures to validate the generator itself.
      #
      # The *native* runtime suites — the ones that drive GObject and
      # GTK through Dart FFI — run in the `native` job below.

      # The published API reference is generated from the committed
      # `packages/<lib>/lib/src/*.dart` (see the comment above). We
      # invoke `tool/build_api_docs.dart` to render the per-package
      # docs into `site/docs/` so the Pages artifact (deploy job,
      # below) carries the live reference. `tool/build_api_docs.dart`
      # also writes the `site/docs/index.html` landing page, rendered
      # through the same layout as the rest of the site.
      - name: Build API docs
        run: dart run tool/build_api_docs.dart --verbose

      # Upload the hand-written site/ folder (with the dartdoc
      # `site/docs/` subdirectory baked in by the previous step) as a
      # GitHub Pages artifact. The `deploy` job below publishes it.
      # We only upload on push to `main` — PRs get the build but no
      # artifact (so a fork's `github-pages` environment isn't
      # accidentally overwritten).
      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The native runtime suites: the bindings driven against a real
  # GLib, a real GObject and a real GTK 4.
  #
  # Until now CI never made a native call — the bindings' central
  # claim (that they are *correct*) was verified by a linter and by
  # generator unit tests, not by running against GTK. This job is that
  # proof:
  #
  #   * the ownership rules — who frees a reference, and when — are
  #     exercised against the real allocator and the real GObject
  #     refcount;
  #   * the byte-array rules are exercised against a real GBytes and a
  #     real async file read;
  #   * the template stack is exercised against a real window: the
  #     part file is built, the window is realised, and the list view
  #     builds its rows.
  #
  # The suites that need a display skip themselves when there is none
  # (`DISPLAY`/`WAYLAND_DISPLAY` are checked), so the display has to be
  # there — hence `xvfb-run`.
  #
  # `GSK_RENDERER=cairo` keeps GTK on its software renderer: the job
  # has no GPU, and the GL renderer would fail to initialise under
  # Xvfb. The widget tests do not care which renderer drew them.
  native:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v2
        with:
          sdk: ^3.13.4

      # The native stack the suites drive:
      #
      #   * `libgtk-4-dev`        — GTK 4 (and libadwaita's dependency)
      #   * `libadwaita-1-dev`    — libadwaita 1 (`example/todo`)
      #   * `libgtksourceview-5-dev` — GtkSourceView 5
      #                             (`packages/gtk_source5`)
      #   * `xvfb`                — the virtual display
      #   * `libgl1-mesa-dri`     — Mesa's software GL, for the
      #                             renderer's benefit
      #
      # The `-dev` packages pull the runtime libraries in; the loader
      # opens the sonames (`libgtk-4.so.1`, `libadwaita-1.so.0`, …).
      - name: Install the native stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgtksourceview-5-dev \
            xvfb \
            libgl1-mesa-dri

      - name: dart pub get
        run: dart pub get

      # `example/todo`'s part file is generated at build time — the
      # template stack's contract is that the user writes
      # `part 'todo_window.g.dart';` and the builder writes the file
      # next to the source. The window's own test needs it, so it is
      # built before the suites run.
      - name: build example/todo
        working-directory: example/todo
        run: dart run build_runner build

      - name: Native runtime suites
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          xvfb-run -a dart test \
            packages/dart_gobject \
            packages/gdk4 \
            packages/gio \
            packages/gir_ffi \
            packages/glib \
            packages/gobject \
            packages/gtk4 \
            packages/gtk_source5 \
            example/gtk4_examples \
            example/notepad \
            example/todo

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
