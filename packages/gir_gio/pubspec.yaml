name: gir_gio
description: "Generated Dart FFI bindings for Gio 2.0 — files, networking, D-Bus, settings and the application platform on top of GLib. Produced by gir_generator."
homepage: "https://dartgir.tenderowl.com"
repository: "https://github.com/TenderOwl/dart-gir"
issue_tracker: "https://github.com/TenderOwl/dart-gir/issues"
topics:
  - ffi
  - gio
  - bindings
  - gnome
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi
  gir_glib:
    path: ../gir_glib
  gir_gobject:
    path: ../gir_gobject

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
