name: gir_adw
description: "Generated Dart FFI bindings for Adw 1 — libadwaita’s adaptive widgets for GNOME applications: header bars, toasts and navigation. Produced by gir_generator."
homepage: "https://dartgir.tenderowl.com"
repository: "https://github.com/TenderOwl/dart-gir"
issue_tracker: "https://github.com/TenderOwl/dart-gir/issues"
topics:
  - ffi
  - libadwaita
  - gnome
  - bindings
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi
  gir_gdk4:
    path: ../gir_gdk4
  gir_gio:
    path: ../gir_gio
  gir_glib:
    path: ../gir_glib
  gir_gobject:
    path: ../gir_gobject
  gir_gsk4:
    path: ../gir_gsk4
  gir_gtk4:
    path: ../gir_gtk4
  gir_pango:
    path: ../gir_pango

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
