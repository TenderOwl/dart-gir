name: gir_cairo
description: "Generated Dart FFI bindings for cairo 1.0 — 2D vector graphics: paths, surfaces, gradients and transforms. Produced by gir_generator."
homepage: "https://dartgir.tenderowl.com"
repository: "https://github.com/TenderOwl/dart-gir"
issue_tracker: "https://github.com/TenderOwl/dart-gir/issues"
topics:
  - ffi
  - cairo
  - graphics
  - bindings
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
