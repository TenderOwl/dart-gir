name: gir_gi_repository3
description: "Generated Dart FFI bindings for GIRepository 3.0 — the GIR typelib loader, for at-runtime introspection of libraries that are not statically bound. Produced by gir_generator."
homepage: "https://dartgir.tenderowl.com"
repository: "https://github.com/TenderOwl/dart-gir"
issue_tracker: "https://github.com/TenderOwl/dart-gir/issues"
topics:
  - ffi
  - gir
  - introspection
  - bindings
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi
  gir_glib:
    path: ../gir_glib
  gir_gobject:
    path: ../gir_gobject

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
