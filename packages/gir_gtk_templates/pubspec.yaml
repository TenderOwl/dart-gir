name: gir_gtk_templates
version: 0.5.0
description: >-
  Runtime support for the @GtkTemplate, @GtkTemplateChild and @GtkTemplateCallback annotations and the _$ClassTemplate mixin contract. Pair with gir_gtk_templates_builder.
homepage: https://dartgir.tenderowl.com
repository: https://github.com/TenderOwl/dart-gir
issue_tracker: https://github.com/TenderOwl/dart-gir/issues
topics:
  - gtk4
  - template
  - widget
  - ffi
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_glib:
    path: ../gir_glib
  gir_gobject:
    path: ../gir_gobject
  gir_gtk4:
    path: ../gir_gtk4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
