name: gir_gtk_templates_builder
version: 0.5.0
description: >-
  A build_runner builder that scans Dart source for @GtkTemplate classes and emits the _$ClassTemplate mixin that wires the template, its children and its signal handlers.
homepage: https://dartgir.tenderowl.com
repository: https://github.com/TenderOwl/dart-gir
issue_tracker: https://github.com/TenderOwl/dart-gir/issues
topics:
  - gtk4
  - template
  - build-runner
  - codegen
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  analyzer: ^14.5.0
  build: ^4.0.7
  build_runner: ^2.15.1
  dart_style: ^3.1.14
  gir_gtk_templates:
    path: ../gir_gtk_templates
  path: ^1.9.0

dev_dependencies:
  build_test: ^3.5.16
  lints: ^6.0.0
  test: ^1.25.6
  # The fixture under `test/fixtures/` is part of this package's
  # analysis: it is the proof that the *generated* part file
  # type-checks. These are the packages its imports (and the
  # generated file's inherited imports) resolve against.
  gir_adw:
    path: ../gir_adw
  gir_dart_gobject:
    path: ../gir_dart_gobject
  gir_gtk4:
    path: ../gir_gtk4
