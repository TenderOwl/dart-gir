include: package:lints/core.yaml

analyzer:
  errors:
    # `package:analyzer` carries lengthy `<...>` type names in
    # its public API; the builder references them in doc
    # comments without escaping.
    unintended_html_in_doc_comment: ignore
    # `GType` mirrors the `static int get GType` accessor the generator
    # emits for every GIR class — GLib's own name for it. The
    # lowerCamelCase convention is intentionally broken here.
    non_constant_identifier_names: ignore
