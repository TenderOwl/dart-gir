name: gtk_templates_builder
description: >
  build_runner builder for `package:gtk_templates`. Scans user source
  for `@GtkTemplate` / `@TemplateChild` / `@TemplateCallback` annotations
  and emits a `part` file containing the GLib-side bookkeeping
  (`g_type_register_static`, `gtk_widget_class_set_template_from_resource`,
  `bind_template_callback_full`, child lookup via
  `gtk_widget_get_template_child`).
publish_to: none
# Intentionally NOT in the workspace — the build_runner dependency
# tree (build, source_gen, analyzer) conflicts with the rest of
# the workspace's analyzer pin. The builder is invoked by the
# user's `dart run build_runner build` command from their own
# package, which doesn't need workspace resolution. A local
# `pubspec_overrides.yaml` redirects to path-deps when running in
# this workspace.

environment:
  sdk: ^3.13.4

dependencies:
  build: ^2.4.1
  source_gen: ^1.5.0
  analyzer: ">=6.4.0 <6.6.0"
  gtk_templates:
  gtk4:
  gobject:
  gir_ffi:

dev_dependencies:
  build_test: ^2.2.0
  lints: ^6.0.0
  test: ^1.25.6