name: gtk_templates_builder
version: 0.3.0
description: >-
  build_runner Builder that scans Dart source for `@GtkTemplate`
  annotations and emits the per-class `_$<className>Template`
  mixin that wires the template, the children, and (in a
  follow-up) the callbacks. Pure codegen lives in
  `package:gtk_templates_builder/codegen.dart` and is exported
  for tests.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  analyzer: ^10.0.0
  build: ^4.0.7
  build_runner: ^2.15.1
  gtk_templates:
    path: ../gtk_templates
  path: ^1.9.0

dev_dependencies:
  build_test: ^3.5.16
  lints: ^6.0.0
  test: ^1.25.6