name: dart_gobject
description: >-
  Dart-level GObject types: register a native `GType` for a Dart class so it
  can be stored in a `GListStore`, type-checked natively, and found again
  after a round trip through native code.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi
  gobject:
    path: ../gobject

dev_dependencies:
  lints: ^6.0.0
  test: ^1.32.0
