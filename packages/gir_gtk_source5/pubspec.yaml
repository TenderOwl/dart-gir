name: gir_gtk_source5
description: "Generated Dart FFI bindings for GtkSource 5 — source-code-aware text views: language specs, syntax highlighting and gutter renderers. Produced by gir_generator."
homepage: "https://dartgir.tenderowl.com"
repository: "https://github.com/TenderOwl/dart-gir"
issue_tracker: "https://github.com/TenderOwl/dart-gir/issues"
topics:
  - ffi
  - gtksourceview
  - text
  - bindings
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi
  gir_gdk4:
    path: ../gir_gdk4
  gir_gdk_pixbuf:
    path: ../gir_gdk_pixbuf
  gir_gio:
    path: ../gir_gio
  gir_glib:
    path: ../gir_glib
  gir_gobject:
    path: ../gir_gobject
  gir_gtk4:
    path: ../gir_gtk4
  gir_pango:
    path: ../gir_pango

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
