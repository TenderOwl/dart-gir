name: gtk_templates
version: 0.3.0
description: >-
  Runtime support for `@GtkTemplate` / `@GtkTemplateChild` /
  `@GtkTemplateCallback` annotations and the `_$ClassTemplate` mixin
  contract. Pair with `gtk_templates_builder` (build_runner) to
  emit the per-class mixin that wires up GTK composite templates.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  glib:
    path: ../glib
  gobject:
    path: ../gobject
  gtk4:
    path: ../gtk4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6