name: gir_gdk4
description: "Generated Dart FFI bindings for Gdk 4.0 — the display-server abstraction: surfaces, input events, clipboard and drag-and-drop. Produced by gir_generator."
homepage: "https://dartgir.tenderowl.com"
repository: "https://github.com/TenderOwl/dart-gir"
issue_tracker: "https://github.com/TenderOwl/dart-gir/issues"
topics:
  - ffi
  - gtk4
  - gdk
  - bindings
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi
  gir_cairo:
    path: ../gir_cairo
  gir_gdk_pixbuf:
    path: ../gir_gdk_pixbuf
  gir_gio:
    path: ../gir_gio
  gir_glib:
    path: ../gir_glib
  gir_gobject:
    path: ../gir_gobject
  gir_pango:
    path: ../gir_pango

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
