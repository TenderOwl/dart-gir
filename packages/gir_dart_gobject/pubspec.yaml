name: gir_dart_gobject
description: >-
  Dart-level GObject types: register a native GType for a Dart class so it can be stored in a GListStore, type-checked natively, and found again after a round trip.
homepage: https://dartgir.tenderowl.com
repository: https://github.com/TenderOwl/dart-gir
issue_tracker: https://github.com/TenderOwl/dart-gir/issues
topics:
  - gobject
  - gtype
  - dart
  - ffi
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  ffi: ^2.1.3
  gir_ffi:
    path: ../gir_ffi
  gir_gobject:
    path: ../gir_gobject

dev_dependencies:
  lints: ^6.0.0
  test: ^1.32.0
