# Wires `gtk_templates_builder` into `build_runner` so the
# `_$TodoWindowTemplate` mixin is regenerated on every
# `dart run build_runner build`. The builder scans every
# `.dart` file under `lib/`, finds `@GtkTemplate`-annotated
# classes, and writes one `<input>.g.dart` part file next to
# each source file. The user `with`s the generated mixin in
# their class and pulls the part file in with a
# `part '<input>.g.dart';` directive.
#
# `build_to: source` is **not** set here: it belongs to the
# provider package's `build.yaml`
# (`packages/gtk_templates_builder/build.yaml`), where it
# makes the generated file land next to the source instead of
# in `.dart_tool/build/generated/`. Dart requires a part file to
# sit in the same directory as its library, so this is what
# makes the `part` directive resolve.
#
# The template lives in `data/window.ui`, and the builder reads it
# through the build's asset reader — which is what makes it a tracked
# input: editing the `.ui` re-runs the builder.
#
# A file is only visible to a build when it is *public*, and the
# default public assets are `lib/**`, `bin/**` and a few named files.
# `data/**` is not one of them, so it is declared here. A template
# under `lib/` needs no configuration at all.
additional_public_assets:
  - data/**

targets:
  $default:
    builders:
      gtk_templates_builder:
        generate_for:
          - lib/**.dart
