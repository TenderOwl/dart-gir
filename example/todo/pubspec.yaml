name: todo
description: >-
  GTK4 todo window built with `@GtkTemplate`. Demonstrates
  the auto-wired callback trampoline: the XML's
  `<signal name="clicked" handler="on_clicked"/>` is wired
  to the user's `onClicked()` instance method by the
  generated `_$TodoWindowTemplate` mixin.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.32.0
  build_runner: ^2.16.2
  gir_gtk_templates_builder:
    path: ../../packages/gir_gtk_templates_builder

dependencies:
  path: ^1.9.0
  ffi: ^2.1.3

  gir_adw:
    path: ../../packages/gir_adw
  gir_dart_gobject:
    path: ../../packages/gir_dart_gobject
  gir_ffi:
    path: ../../packages/gir_ffi
  gir_gio:
    path: ../../packages/gir_gio
  gir_gobject:
    path: ../../packages/gir_gobject
  gir_glib:
    path: ../../packages/gir_glib
  gir_gtk4:
    path: ../../packages/gir_gtk4
  gir_gtk_templates:
    path: ../../packages/gir_gtk_templates
